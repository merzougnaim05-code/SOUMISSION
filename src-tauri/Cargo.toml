[package]
name = "soumission"
version = "1.0.0"
description = "برنامج الاستشارات — تموين المطعم والتدفئة المركزية"
authors = ["merzougnaim05-code"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
